# nginx site for Caspian Pro. Replace app.example.ir with your domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/caspian-pro
#   sudo ln -s /etc/nginx/sites-available/caspian-pro /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.example.ir      # free HTTPS certificate
server {
    listen 80;
    server_name app.example.ir;

    client_max_body_size 10m;   # photos in maintenance reports

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
